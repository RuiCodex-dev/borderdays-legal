<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">Stampline - legal and privacy pages</title>
  <desc id="d">Banner with the Stampline name, the tagline "Schengen 90/180 day counter, no GPS tracking", five language chips and an animated passport stamp.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14203a"/>
      <stop offset=".55" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#1a5fc4"/>
    </linearGradient>
    <radialGradient id="glow" cx=".78" cy=".35" r=".55">
      <stop offset="0" stop-color="#1a73e8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#1a73e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#8ab4f8" fill-opacity=".14"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="340" rx="24"/></clipPath>
    <clipPath id="titleClip">
      <text x="72" y="178" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="96" font-weight="800" letter-spacing="-2">Stampline</text>
    </clipPath>
    <path id="ring" d="M 0,-92 a 92,92 0 1,1 -0.01,0"/>
    <style>
      .f{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
      .route{stroke-dasharray:2 12;animation:drift 6s linear infinite}
      @keyframes drift{to{stroke-dashoffset:-140}}
      .node{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .n2{animation-delay:1s}.n3{animation-delay:2s}
      @keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
      .stamp{transform-box:view-box;transform-origin:1040px 170px;animation:press 9s cubic-bezier(.2,.9,.25,1.2) infinite}
      @keyframes press{0%{opacity:0;transform:translate(0,0) rotate(-14deg) scale(1.35)}
        6%{opacity:.95;transform:rotate(-14deg) scale(.97)}9%{transform:rotate(-14deg) scale(1)}
        88%{opacity:.95;transform:rotate(-14deg) scale(1)}100%{opacity:0;transform:rotate(-14deg) scale(1)}}
      .sheen{animation:sweep 7s ease-in-out infinite}
      @keyframes sweep{0%,55%{transform:translateX(-420px)}85%,100%{transform:translateX(620px)}}
      .rise{animation:rise 1.1s ease-out both}.r2{animation-delay:.15s}.r3{animation-delay:.3s}.r4{animation-delay:.45s}
      @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){.route,.node,.stamp,.sheen,.rise{animation:none}.stamp{opacity:.95;transform:rotate(-14deg)}}
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <rect width="1280" height="340" fill="url(#glow)"/>
    <rect x="640" width="640" height="340" fill="url(#dots)"/>
    <!-- travel route -->
    <path class="route" d="M 640 300 C 760 250, 790 120, 900 110 S 1080 210, 1200 70 S 1290 40, 1300 30" fill="none" stroke="#8ab4f8" stroke-opacity=".7" stroke-width="2.4" stroke-linecap="round"/>
    <circle class="node" cx="900" cy="110" r="5" fill="#8ab4f8"/>
    <circle class="node n2" cx="1200" cy="70" r="5" fill="#8ab4f8"/>
    <circle class="node n3" cx="726" cy="246" r="5" fill="#8ab4f8"/>
    <!-- passport stamp -->
    <g class="stamp" fill="none" stroke="#d9b45a">
      <g transform="translate(1040 170)">
        <circle r="112" stroke-width="4"/>
        <circle r="74" stroke-width="2"/>
        <text class="f" font-size="17" font-weight="700" fill="#d9b45a" stroke="none">
          <textPath href="#ring" textLength="570" lengthAdjust="spacing">SCHENGEN · ROLLING WINDOW · NO GPS · </textPath>
        </text>
        <text class="f" x="0" y="-12" text-anchor="middle" font-size="44" font-weight="800" fill="#d9b45a" stroke="none" letter-spacing="-1">90/180</text>
        <line x1="-48" y1="6" x2="48" y2="6" stroke-width="2"/>
        <text class="f" x="0" y="34" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="3" fill="#d9b45a" stroke="none">DAYS</text>
      </g>
    </g>
    <!-- copy -->
    <text class="f rise" x="74" y="76" font-size="15" font-weight="700" letter-spacing="4.5" fill="#8ab4f8">RUI CODEX  ·  LEGAL</text>
    <text class="f rise r2" x="72" y="178" font-size="96" font-weight="800" letter-spacing="-2" fill="#ffffff">Stampline</text>
    <g clip-path="url(#titleClip)"><rect class="sheen" x="40" y="80" width="260" height="120" fill="url(#sheen)" transform="skewX(-18)"/></g>
    <text class="f rise r3" x="75" y="222" font-size="24" font-weight="500" fill="#e3ecff">Privacy policy for the Schengen 90/180 day counter</text>
    <g class="rise r4">
      <g class="m" font-size="14" font-weight="700" fill="#ffffff">
        <rect x="75" y="250" width="50" height="30" rx="15" fill="#ffffff" fill-opacity=".12" stroke="#8ab4f8" stroke-opacity=".5"/>
        <text x="100" y="270" text-anchor="middle">EN</text>
        <rect x="135" y="250" width="50" height="30" rx="15" fill="#ffffff" fill-opacity=".12" stroke="#8ab4f8" stroke-opacity=".5"/>
        <text x="160" y="270" text-anchor="middle">TR</text>
        <rect x="195" y="250" width="50" height="30" rx="15" fill="#ffffff" fill-opacity=".12" stroke="#8ab4f8" stroke-opacity=".5"/>
        <text x="220" y="270" text-anchor="middle">DE</text>
        <rect x="255" y="250" width="50" height="30" rx="15" fill="#ffffff" fill-opacity=".12" stroke="#8ab4f8" stroke-opacity=".5"/>
        <text x="280" y="270" text-anchor="middle">ES</text>
        <rect x="315" y="250" width="50" height="30" rx="15" fill="#ffffff" fill-opacity=".12" stroke="#8ab4f8" stroke-opacity=".5"/>
        <text x="340" y="270" text-anchor="middle">FR</text>
      </g>
      <text class="f" x="386" y="271" font-size="16" fill="#c9d6f0">GDPR · controller in Belgium · no data leaves the device</text>
    </g>
  </g>
</svg>
